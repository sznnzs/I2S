[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intervention-to-skill"
version = "0.1.0"
description = "Persistent procedural skills for small–large language model collaboration"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["PyYAML>=6,<7", "openai>=1.60,<3", "httpx>=0.27,<1"]

[project.urls]
Homepage = "https://modalitydance.github.io/I2S/"
Repository = "https://github.com/ModalityDance/I2S"
Issues = "https://github.com/ModalityDance/I2S/issues"

[project.optional-dependencies]
training = ["torch>=2.5,<2.9", "transformers>=4.51,<5", "peft>=0.15,<1", "accelerate>=1,<2", "safetensors>=0.4"]
scoring = ["transformers>=4.51,<5", "jinja2>=3.1,<4"]
serving = ["vllm>=0.10,<0.12"]

[project.scripts]
i2s = "i2s.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
